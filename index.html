<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dira Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<meta name="description" content="Dira Signal: What matters. Verified. Verified news and context from Kenya, Africa and the world.">
<meta property="og:title" content="Dira Signal">
<meta property="og:description" content="What matters. Verified.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1a20'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23eaf0ef' stroke-width='6'/%3E%3Cpath d='M32 32 L44 20' stroke='%23f2542d' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --accent:#0e5e6f;--accent-ink:#fff;--signal:#f2542d;
  --bg:#f4f6f5;--surface:#ffffff;--surface-2:#eaefee;
  --text:#0f1a20;--text-2:#4b5a60;--text-3:#7d8a8f;
  --border:#dbe1e0;--border-2:#c3cccb;
  --ok:#3f7a12;--ok-bg:#eaf3de;--danger:#b42323;--danger-bg:#fcebeb;
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;
  --text:#f0efe9;--text-2:#b9b8b0;--text-3:#8a8981;
  --border:#2f2f2c;--border-2:#45443f;
  --ok:#8fcb5a;--ok-bg:#24311a;--danger:#ff8a8a;--danger-bg:#3a1d1d;--accent:#4fb3c4;--accent-ink:#0b1317;--signal:#ff7350;--bg:#0b1317;--surface:#121d22;--surface-2:#18262c;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --accent:#4fb3c4;--accent-ink:#0b1317;--signal:#ff7350;color-scheme:dark;
  --bg:#141413;--surface:#1d1d1b;--surface-2:#262624;
  --text:#f0efe9;--text-2:#b9b8b0;--text-3:#8a8981;
  --border:#2f2f2c;--border-2:#45443f;
  --ok:#8fcb5a;--ok-bg:#24311a;--danger:#ff8a8a;--danger-bg:#3a1d1d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.mark{width:34px;height:34px;background:var(--accent);border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.logo b{font-size:21px;display:block;line-height:1.1}
.word{font-family:var(--serif);font-weight:800;letter-spacing:-.02em}.word i{font-style:normal;font-weight:600}
.logo small{font-size:11px;color:var(--text-2);letter-spacing:.04em}
.top nav{display:flex;gap:14px;font-size:13px}
.top nav a{text-decoration:none;color:var(--text-2)}
.top nav a:hover{color:var(--text)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.pill{padding:5px 12px;border-radius:20px;font-size:12.5px;border:1px solid var(--border-2);color:var(--text-2);background:transparent;white-space:nowrap;cursor:pointer;font-family:inherit}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main.wrap{padding-top:18px;padding-bottom:40px}
.grid{display:grid;grid-template-columns:1fr 300px;gap:24px}
@media (max-width:820px){.grid{grid-template-columns:1fr}.top nav{display:none}}
.breaking{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--danger-bg);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;text-decoration:none}
.breaking .tag{font-size:10.5px;font-weight:700;color:var(--signal);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.breaking .t{font-size:14px;flex:1;font-weight:500}
.breaking .tm{font-size:11px;color:var(--text-3);white-space:nowrap}
.card{display:block;text-decoration:none;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--surface);transition:border-color .15s}
.card:hover{border-color:var(--border-2)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:11.5px;color:var(--text-3)}
.cat{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.card h2{font-family:var(--serif);font-size:19px;line-height:1.3;margin-bottom:6px}
.card p{font-size:14px;color:var(--text-2)}
.foot{margin-top:10px;font-size:12px;color:var(--text-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.vbadge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--ok);background:var(--ok-bg);padding:2px 8px;border-radius:20px}
aside .box{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);margin-bottom:10px}
aside ol{list-style:none}
aside li{font-size:13px;padding:7px 0;border-top:1px solid var(--border)}
aside li:first-child{border-top:0;padding-top:0}
aside li a{text-decoration:none}
aside li a:hover{text-decoration:underline}
aside .small{font-size:13px;color:var(--text-2)}
aside .small a{color:var(--accent)}
article{max-width:680px}
article .back{font-size:13px;color:var(--text-2);text-decoration:none;display:inline-block;margin-bottom:14px}
article h1{font-family:var(--serif);font-size:30px;line-height:1.22;margin:6px 0 10px}
article .lede{font-size:17px;color:var(--text-2);margin-bottom:14px}
article .byline{font-size:13px;color:var(--text-3);margin-bottom:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
article .body p{font-size:17px;margin-bottom:16px;line-height:1.65}
.panel{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:22px 0;background:var(--surface)}
.panel h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;color:var(--text-2)}
.panel ul{padding-left:18px;font-size:14px}
.panel li{margin-bottom:4px}
.share{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.share a,.share button{font-size:13px;padding:6px 12px;border-radius:20px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);text-decoration:none;cursor:pointer;font-family:inherit}
.page h1{font-family:var(--serif);font-size:28px;margin-bottom:12px}
.page h2{font-size:17px;margin:20px 0 6px}
.page p,.page li{font-size:15.5px;margin-bottom:8px}
.page ul{padding-left:20px}
.empty{padding:30px;text-align:center;color:var(--text-2);border:1px dashed var(--border-2);border-radius:12px}
footer{border-top:1px solid var(--border);padding:20px 0 30px;font-size:12.5px;color:var(--text-3)}
footer a{color:var(--text-2)}
.pill{text-decoration:none}
.subs{display:flex;gap:4px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;margin-top:-2px}
.subs::-webkit-scrollbar{display:none}
.sp{font-size:12px;padding:3px 10px;border-radius:6px;color:var(--text-2);text-decoration:none;white-space:nowrap}
.sp:hover{background:var(--surface-2)}
.sp.on{background:var(--surface-2);color:var(--text);font-weight:600}
.kick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ftag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:4px;background:var(--surface-2);color:var(--text-2)}
.f-breaking{background:var(--danger-bg);color:var(--danger)}
.f-fact-check{background:var(--ok-bg);color:var(--ok)}
.f-opinion{background:#efe7fb;color:#55308f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .f-opinion{background:#2c2340;color:#c9b3f2}}
:root[data-theme="dark"] .f-opinion{background:#2c2340;color:#c9b3f2}
.vbadge.op{background:var(--surface-2);color:var(--text-2)}
.listhead{margin:4px 0 14px}
.listhead h1{font-family:var(--serif);font-size:26px}
.listhead p{color:var(--text-2);font-size:14.5px}
.verdict{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:4px;margin-right:6px;vertical-align:1px}
.verdict.big{font-size:13px;padding:4px 10px}
.v-true{background:var(--ok-bg);color:var(--ok)}
.v-false{background:var(--danger-bg);color:var(--danger)}
.v-mis{background:#faeeda;color:#7a4508}
.v-unp{background:var(--surface-2);color:var(--text-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .v-mis{background:#3a2c14;color:#f0c27a}}
:root[data-theme="dark"] .v-mis{background:#3a2c14;color:#f0c27a}
.claimline{font-size:13.5px;margin:2px 0 6px;color:var(--text)}
.fcbox{border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin:0 0 18px;background:var(--surface)}
.fcbox p{font-family:var(--serif);font-size:18px;margin:4px 0 10px}
.fcbox .small{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.wirebrief{border:1px solid var(--border);border-radius:12px;background:var(--surface-2);padding:16px;margin:0 0 22px}
.wirebrief h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:10px}
.wb-row{padding:9px 0;border-top:1px solid var(--border)}
.wb-row:first-of-type{border-top:0;padding-top:0}
.wb-row h5{font-size:13px;margin-bottom:3px}
.wb-row p,.wb-row li{font-size:14.5px;color:var(--text)}
.wb-row ul{padding-left:18px}
.wb-row ul.ok li::marker{content:"✓  ";color:var(--ok)}
.wb-row ul.unc li::marker{content:"?  ";color:var(--danger)}
.wire li{margin-bottom:9px}.wire a{font-size:13.5px;line-height:1.35}
.wire .src{display:block;font-family:var(--mono, monospace);font-size:10.5px;color:var(--text-3);margin-top:2px}
.wire .rep{display:inline-block;font-size:10px;font-weight:600;color:#C68A00;letter-spacing:.02em;margin-right:4px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <a class="logo" href="#/"><svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0f1a20"/><circle cx="30" cy="34" r="17" fill="none" stroke="#eaf0ef" stroke-width="3.5"/><path d="M30 34 L40 24" stroke="#f2542d" stroke-width="4.5" stroke-linecap="round"/><path d="M30 34 L23 41" stroke="#eaf0ef" stroke-width="4.5" stroke-linecap="round"/><path d="M45 13 a8 8 0 0 1 5 5" fill="none" stroke="#f2542d" stroke-width="3" stroke-linecap="round"/></svg><span><b class="word">dira <i>signal</i></b><small>WHAT MATTERS. VERIFIED.</small></span></a>
      <nav><a href="#/format/fact-check">Fact Check</a><a href="#/format/explainer">Explainers</a><a href="#/how-we-verify">How we verify</a><a href="#/corrections">Corrections</a></nav>
    </div>
    <div class="cats" id="cats"></div>
    <div class="subs" id="subs"></div>
  </div>
</header>

<main class="wrap" id="app"><div class="empty">Loading the latest verified stories…</div></main>

<footer>
  <div class="wrap">
    © <span id="yr"></span> Dira Signal · What matters. Verified. ·
    <a href="#/how-we-verify">How we verify</a> · <a href="#/corrections">Corrections</a>
  </div>
</footer>

<script>
// ---- Editorial architecture ----
const SECTIONS = [
  {key:'kenya', label:'Kenya', subs:['Government','Politics','Counties','Law & Justice','Security']},
  {key:'business', label:'Business', subs:['Companies','Finance & Banking','Markets & Investment','SMEs & Entrepreneurship','Agriculture & Agribusiness','Real Estate','Energy']},
  {key:'society', label:'Society', subs:['Health','Education','Environment','People & Communities']},
  {key:'technology', label:'Technology', subs:['Tech','AI','Fintech','Telecoms','Digital Economy']},
  {key:'infrastructure', label:'Infrastructure', subs:['Transport','Roads','Housing','Construction','Infrastructure Projects']},
  {key:'lifestyle', label:'Lifestyle', subs:['Tourism & Travel','Entertainment','Culture','Food','Fashion']},
  {key:'sports', label:'Sports', subs:['Football','Athletics','Rugby','Other Sports']},
  {key:'world', label:'World', subs:['Africa','East Africa','International']},
];
const FORMATS = {
  'news':'News','breaking':'Breaking','investigation':'Investigations','explainer':'Explainers',
  'fact-check':'Fact Check','analysis':'Analysis','interview':'Interviews','data':'Data','opinion':'Opinion'
};
const SEC = Object.fromEntries(SECTIONS.map(s => [s.key, s]).concat([['about',{key:'about',label:'About us',subs:[]}]]));
const VERDICT_CLASS = {'True':'v-true','False':'v-false','Misleading':'v-mis','Unproven':'v-unp','Partly true':'v-mis'};
let STORIES = [];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const storyLink = s => `#/story/${encodeURIComponent(s.id)}`;
const fmt = s => s.format || 'news';
const isBreaking = s => s.breaking || fmt(s) === 'breaking';

function ago(iso){
  const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (isNaN(s)) return '';
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  if (s < 7*86400) return Math.floor(s/86400) + 'd ago';
  return d.toLocaleDateString('en-KE',{day:'numeric',month:'short',year:'numeric'});
}
const fullDate = iso => new Date(iso).toLocaleString('en-KE',{dateStyle:'medium',timeStyle:'short',timeZone:'Africa/Nairobi'}) + ' EAT';
function badge(s){
  const n = s.sources?.length || 0, src = `${n} source${n===1?'':'s'}`;
  if (fmt(s) === 'opinion') return `<span class="vbadge op">Opinion · facts checked</span>`;
  if (s.signal === 'disputed') return `<span class="vbadge op">Core facts verified · some points disputed · ${src}</span>`;
  return `<span class="vbadge">✓ Verified · ${src}</span>`;
}
function kicker(s){
  const sec = SEC[s.section]?.label || s.section || '';
  const f = fmt(s);
  return `<span class="cat">${esc(sec)}${s.subsection?` · ${esc(s.subsection)}`:''}</span>${f!=='news'?`<span class="ftag f-${f}">${esc(FORMATS[f]||f)}</span>`:''}`;
}

let WIRE = {items:[]};
async function loadWire(){
  try{
    const r = await fetch('wire.json?t=' + Date.now(), {cache:'no-store'});
    WIRE = await r.json();
  }catch(e){ WIRE = {items:[]}; }
}
function wireBox(){
  const items = (WIRE.items || []).slice(0, 10);
  if (!items.length) return '';
  const li = items.map(it => `<li><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a><span class="src"><span class="rep">REPORTED</span>by ${esc(it.source)}${it.at?` · ${ago(it.at)}`:''}</span></li>`).join('');
  return `<div class="box wire"><h3>Live wire</h3><p class="small" style="margin-bottom:8px">Headlines from named outlets, updated every 10 minutes. Not yet checked by Dira Signal. Each one links to the original.</p><ol>${li}</ol>${WIRE.updated?`<p class="small">Wire updated ${ago(WIRE.updated)}</p>`:''}</div>`;
}

async function load(refresh){
  await loadWire();
  try{
    const r = await fetch('stories.json?t=' + Date.now(), {cache:'no-store'});
    const data = await r.json();
    STORIES = (data.stories || [])
      .filter(s => s.status === 'verified')          // drafts never show
      .sort((a,b) => new Date(b.published) - new Date(a.published));
  }catch(e){
    STORIES = [];
    console.error('Could not load stories.json', e);
  }
  if (refresh && parse().view === 'story') return;
  route(!refresh);
}

// ---- Routing: #/  #/section/business  #/section/business/energy  #/format/fact-check  #/story/id ----
function parse(){
  const p = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  return {view:p[0]||'home', a:p[1], b:p[2]};
}

function renderNav(r){
  const sec = r.view === 'section' ? r.a : null;
  const fm = r.view === 'format' ? r.a : null;
  document.getElementById('cats').innerHTML =
    `<a class="pill${r.view==='home'?' on':''}" href="#/">Latest</a>` +
    SECTIONS.map(s => `<a class="pill${s.key===sec?' on':''}" href="#/section/${s.key}">${s.label}</a>`).join('');
  const sub = document.getElementById('subs');
  if (sec && SEC[sec]) {
    sub.innerHTML = `<a class="sp${!r.b?' on':''}" href="#/section/${sec}">All ${esc(SEC[sec].label)}</a>` +
      SEC[sec].subs.map(x => `<a class="sp${slug(x)===r.b?' on':''}" href="#/section/${sec}/${slug(x)}">${esc(x)}</a>`).join('');
  } else {
    sub.innerHTML = Object.entries(FORMATS).filter(([k]) => k!=='news')
      .map(([k,l]) => `<a class="sp${k===fm?' on':''}" href="#/format/${k}">${esc(l)}</a>`).join('');
  }
}

function card(s){
  const fc = fmt(s) === 'fact-check' && s.verdict
    ? `<div class="claimline"><span class="verdict ${VERDICT_CLASS[s.verdict]||'v-unp'}">${esc(s.verdict)}</span>${esc(s.claim||'')}</div>` : '';
  return `<a class="card" href="${storyLink(s)}">
    <div class="meta"><span class="kick">${kicker(s)}</span><span>${ago(s.published)}</span></div>
    <h2>${esc(s.title)}</h2>
    ${fc}
    <p>${esc(s.summary)}</p>
    <div class="foot">${badge(s)}${s.location?`<span>${esc(s.location)}</span>`:''}</div>
  </a>`;
}

function sidebar(){
  const latest = STORIES.slice(0,6).map(s => `<li><a href="${storyLink(s)}">${esc(s.title)}</a><div style="font-size:11px;color:var(--text-3)">${ago(s.published)}</div></li>`).join('');
  const checks = STORIES.filter(s => fmt(s)==='fact-check').slice(0,4)
    .map(s => `<li><a href="${storyLink(s)}"><span class="verdict ${VERDICT_CLASS[s.verdict]||'v-unp'}">${esc(s.verdict||'')}</span> ${esc(s.claim||s.title)}</a></li>`).join('');
  return `<aside>
    ${wireBox()}
    <div class="box"><h3>Our promise</h3><p class="small">Something happened. We tell you what actually happened, what has been verified, who is involved, why it matters and what happens next. <a href="#/how-we-verify">How we verify →</a></p></div>
    <div class="box"><h3>Fact Check</h3><ol>${checks || '<li class="small">No fact checks yet.</li>'}</ol><p class="small" style="margin-top:8px"><a href="#/format/fact-check">All fact checks →</a></p></div>
    <div class="box"><h3>Latest</h3><ol>${latest || '<li>No stories yet.</li>'}</ol></div>
    <div class="box"><h3>Spotted a mistake?</h3><p class="small">We correct openly. See our <a href="#/corrections">corrections log</a>.</p></div>
  </aside>`;
}

function listPage(list, heading, intro){
  const br = STORIES.find(isBreaking);
  return `<div class="grid"><div>
    ${br ? `<a class="breaking" href="${storyLink(br)}"><span class="tag">⚡ Breaking</span><span class="t">${esc(br.title)}</span><span class="tm">${ago(br.published)}</span></a>` : ''}
    ${heading ? `<div class="listhead"><h1>${esc(heading)}</h1>${intro?`<p>${esc(intro)}</p>`:''}</div>` : ''}
    ${list.length ? list.map(card).join('') : `<div class="empty">No verified stories here yet. Check back soon.</div>`}
  </div>${sidebar()}</div>`;
}

const FORMAT_INTRO = {
  'fact-check':'Claims circulating in Kenya, checked against the evidence.',
  'explainer':'What is going on and why it matters, in plain language.',
  'investigation':'Original reporting that takes time to get right.',
  'analysis':'What the news means, grounded in verified facts.',
  'interview':'On-the-record conversations with the people involved.',
  'data':'Stories told through the numbers.',
  'opinion':'Argument and commentary. Clearly labelled, with the facts checked.',
  'breaking':'Developing news, published only as facts are confirmed.'
};

function wireBrief(b){
  if (!b) return '';
  const li = a => (a||[]).map(x => `<li>${esc(x)}</li>`).join('');
  const row = (t, html) => html ? `<div class="wb-row"><h5>${t}</h5>${html}</div>` : '';
  return `<section class="wirebrief">
    <h4>The Signal</h4>
    ${row('What happened', b.what_happened && `<p>${esc(b.what_happened)}</p>`)}
    ${row('What we have verified', b.verified?.length && `<ul class="ok">${li(b.verified)}</ul>`)}
    ${row('Not yet confirmed', b.unconfirmed?.length && `<ul class="unc">${li(b.unconfirmed)}</ul>`)}
    ${row('Who is involved', b.who?.length && `<ul>${li(b.who)}</ul>`)}
    ${row('Why it matters', b.why_it_matters && `<p>${esc(b.why_it_matters)}</p>`)}
    ${row('What happens next', b.whats_next && `<p>${esc(b.whats_next)}</p>`)}
  </section>`;
}

function story(id){
  const s = STORIES.find(x => x.id === id);
  if (!s) return `<div class="empty">That story isn't available. <a href="#/">Back to latest</a></div>`;
  document.title = s.title + ' · Dira Signal';
  const url = location.href;
  const text = encodeURIComponent(s.title + ' ' + url);
  const fc = fmt(s) === 'fact-check' && s.verdict
    ? `<div class="fcbox"><div class="small">The claim</div><p>“${esc(s.claim||'')}”</p><span class="verdict big ${VERDICT_CLASS[s.verdict]||'v-unp'}">${esc(s.verdict)}</span></div>` : '';
  return `<div class="grid"><article>
    <a class="back" href="${s.section && SEC[s.section] && s.section!=='about' ? '#/section/'+s.section : '#/'}">← ${esc(s.section && s.section!=='about' ? SEC[s.section]?.label : 'Latest news')}</a>
    <div class="kick">${kicker(s)}${isBreaking(s)&&fmt(s)!=='breaking'?'<span class="ftag f-breaking">Breaking</span>':''}</div>
    <h1>${esc(s.title)}</h1>
    <p class="lede">${esc(s.summary)}</p>
    <div class="byline">${badge(s)}<span>By ${esc(s.reporter || 'Dira Signal')}</span>${s.location?`<span>${esc(s.location)}</span>`:''}<span>${fullDate(s.published)}</span>${s.updated?`<span>Updated ${fullDate(s.updated)}</span>`:''}</div>
    ${fc}
    ${wireBrief(s.brief)}
    <div class="body">${(s.body||[]).map(p => `<p>${esc(p)}</p>`).join('')}</div>
    <div class="panel"><h4>How we verified this</h4><ul>${(s.sources||[]).map(x => `<li><b>${esc(x.type || 'Source')}:</b> ${esc(x.name)}</li>`).join('')}</ul></div>
    ${(s.corrections||[]).length ? `<div class="panel"><h4>Corrections</h4><ul>${s.corrections.map(c => `<li>${esc(c.date)}: ${esc(c.note)}</li>`).join('')}</ul></div>` : ''}
    <div class="share">
      <a href="https://wa.me/?text=${text}" target="_blank" rel="noopener">Share on WhatsApp</a>
      <a href="https://twitter.com/intent/tweet?text=${text}" target="_blank" rel="noopener">Share on X</a>
      <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}" target="_blank" rel="noopener">Facebook</a>
      <button onclick="navigator.clipboard.writeText(location.href);this.textContent='Link copied'">Copy link</button>
    </div>
  </article>${sidebar()}</div>`;
}

function verifyPage(){
  return `<div class="page" style="max-width:700px">
    <h1>How we verify</h1>
    <p><b>Dira Signal: what matters, verified.</b> We monitor what is happening across Kenya, Africa and the world, verify it, put it into context and keep updating it. Our rule: don't just report what is being said. Establish what is known.</p>
    <h2>Every story answers six questions</h2>
    <ul><li>What actually happened?</li><li>What has been verified, and what hasn't yet?</li><li>Who is involved?</li><li>Why does it matter?</li><li>What happens next?</li><li>How do we know? (the sources box at the end)</li></ul>
    <h2>A story goes live only when one of these is true</h2>
    <ul>
      <li><b>Two independent sources</b> confirm the core facts. Two outlets repeating the same post count as one.</li>
      <li><b>A primary source on the record:</b> an official statement, court filing, gazette notice or press briefing.</li>
      <li><b>Our own first-hand reporting:</b> we were there and have the notes, photos or video.</li>
    </ul>
    <h2>Fact Check verdicts</h2>
    <ul><li><b>True:</b> the evidence supports the claim.</li><li><b>Partly true / Misleading:</b> some of it is accurate but it leaves a false impression.</li><li><b>False:</b> the evidence contradicts it.</li><li><b>Unproven:</b> there isn't enough evidence either way yet.</li></ul>
    <h2>Opinion</h2>
    <p>Opinion pieces are clearly labelled. The views are the writer's; the facts they rely on are checked like any other story.</p>
    <h2>Breaking news</h2>
    <p>We publish only what is confirmed at the time, say plainly what is not yet confirmed, and update the story as more is verified.</p>
    <h2>What we won't publish</h2>
    <ul><li>Rumours and unconfirmed forwards, however widely shared.</li><li>Names of minors or survivors of sexual violence.</li><li>Paid content dressed up as news.</li></ul>
    <h2>Mistakes</h2>
    <p>We fix them openly and log every fix on our <a href="#/corrections">Corrections page</a>.</p>
  </div>`;
}

function correctionsPage(){
  const rows = STORIES.flatMap(s => (s.corrections||[]).map(c => ({...c, s})))
    .sort((a,b) => new Date(b.date) - new Date(a.date));
  return `<div class="page" style="max-width:700px">
    <h1>Corrections</h1>
    <p>When we get something wrong, we fix it and record it here.</p>
    ${rows.length ? `<ul>${rows.map(r => `<li><b>${esc(r.date)}</b>, <a href="${storyLink(r.s)}">${esc(r.s.title)}</a>: ${esc(r.note)}</li>`).join('')}</ul>` : `<div class="empty">No corrections so far.</div>`}
  </div>`;
}

function route(scroll = true){
  const r = parse();
  document.title = 'Dira Signal · What matters. Verified.';
  renderNav(r);
  const app = document.getElementById('app');
  if (r.view === 'story') app.innerHTML = story(r.a);
  else if (r.view === 'section' && SEC[r.a]) {
    const sec = SEC[r.a], subName = sec.subs.find(x => slug(x) === r.b);
    const list = STORIES.filter(s => s.section === r.a && (!subName || s.subsection === subName));
    app.innerHTML = listPage(list, subName ? `${sec.label}: ${subName}` : sec.label);
  }
  else if (r.view === 'format' && FORMATS[r.a]) app.innerHTML = listPage(STORIES.filter(s => fmt(s) === r.a || (r.a==='breaking' && isBreaking(s))), FORMATS[r.a], FORMAT_INTRO[r.a]);
  else if (r.view === 'how-we-verify') app.innerHTML = verifyPage();
  else if (r.view === 'corrections') app.innerHTML = correctionsPage();
  else app.innerHTML = listPage(STORIES);
  if (scroll) window.scrollTo(0,0);
}

window.addEventListener('hashchange', () => route());
document.getElementById('yr').textContent = new Date().getFullYear();
load();
setInterval(() => load(true), 60000);   // pick up new stories and wire items every minute without a refresh
</script>
</body>
</html>
